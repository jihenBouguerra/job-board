steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - gcr.io/$PROJECT_ID/job-board:$COMMIT_SHA
      - -t
      - gcr.io/$PROJECT_ID/job-board:latest
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - gcr.io/$PROJECT_ID/job-board

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - job-board
      - --image=gcr.io/$PROJECT_ID/job-board:$COMMIT_SHA
      - --region=us-central1
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --memory=256Mi
      - --cpu=1
      - --min-instances=0
      - --max-instances=1
      - --set-env-vars=DATA_DIR=/data

images:
  - gcr.io/$PROJECT_ID/job-board
