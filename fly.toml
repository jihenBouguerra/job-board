app = "job-board-lxn7-q"
primary_region = "ams"

[build]

[env]
  DATA_DIR = "/data"

[http_service]
  internal_port = 8765
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

[[mounts]]
  source = "job_board_data"
  destination = "/data"
