<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f0f14">
  <title>Job Board</title>
  <style>
    :root {
      --bg:          #0f0f14;
      --surface:     #1a1a23;
      --surface-2:   #232330;
      --surface-3:   #2a2a3a;
      --border:      #2e2e3e;
      --border-2:    #3a3a50;
      --text:        #ececf1;
      --text-dim:    #9494a8;
      --text-faint:  #5a5a72;
      --accent:      #8b7cf6;
      --accent-soft: rgba(139,124,246,.15);
      --green:       #4ade80;
      --green-soft:  rgba(74,222,128,.13);
      --red:         #f87171;
      --red-soft:    rgba(248,113,113,.12);
      --yellow:      #facc15;
      --yellow-soft: rgba(250,204,21,.13);
      --radius:      10px;
    }
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{height:100%;min-height:100vh}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
         background:var(--bg);color:var(--text);overflow-x:hidden}

    /* ── Toolbar ── */
    .toolbar{
      position:sticky;top:0;z-index:30;
      background:rgba(15,15,20,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
      border-bottom:1px solid var(--border);
    }
    .toolbar-inner{
      display:flex;align-items:center;justify-content:space-between;gap:12px;
      padding:12px 20px;
    }
    .brand{display:flex;align-items:center;gap:10px}
    h1{font-size:1.1rem;font-weight:700;letter-spacing:-.02em}
    .mark{color:var(--accent)}
    .job-count{
      font-size:.78rem;color:var(--text-dim);font-weight:500;
      background:var(--surface-2);border:1px solid var(--border);
      padding:2px 9px;border-radius:999px;
    }
    .toolbar-right{display:flex;align-items:center;gap:8px}
    .icon-btn{
      background:var(--surface);border:1px solid var(--border);color:var(--text-dim);
      width:34px;height:34px;border-radius:8px;font-size:1rem;
      display:inline-flex;align-items:center;justify-content:center;
      cursor:pointer;text-decoration:none;flex-shrink:0;
    }
    .icon-btn:hover{color:var(--text);border-color:var(--border-2)}
    .run-btn{
      display:inline-flex;align-items:center;gap:6px;
      background:var(--accent);color:#fff;border:none;
      padding:0 14px;height:34px;border-radius:8px;
      font-size:.82rem;font-weight:600;cursor:pointer;white-space:nowrap;
    }
    .run-btn:hover{opacity:.92}
    .run-btn:disabled{opacity:.4;cursor:not-allowed}

    /* ── Filter bar ── */
    .filterbar{
      display:flex;flex-wrap:wrap;align-items:center;gap:8px;
      padding:8px 20px 10px;border-bottom:1px solid var(--border);
      background:var(--bg);
    }
    .search-wrap{position:relative;flex:1;min-width:180px;max-width:300px}
    .search-wrap .mag{
      position:absolute;left:10px;top:50%;transform:translateY(-50%);
      color:var(--text-dim);font-size:.85rem;pointer-events:none;
    }
    input[type="search"]{
      width:100%;background:var(--surface);border:1px solid var(--border);border-radius:8px;
      color:var(--text);font-size:.82rem;outline:none;height:32px;padding:0 10px 0 30px;
    }
    input[type="search"]:focus{border-color:var(--accent)}
    input::placeholder{color:var(--text-faint)}

    .f-divider{width:1px;height:18px;background:var(--border);flex-shrink:0}

    select.f-sel{
      background:var(--surface);border:1px solid var(--border);border-radius:8px;
      color:var(--text);font-size:.82rem;height:32px;padding:0 8px;
      cursor:pointer;outline:none;
    }
    select.f-sel:focus{border-color:var(--accent)}

    .date-chips{display:flex;gap:5px}
    .dchip{
      background:var(--surface);border:1px solid var(--border);color:var(--text-dim);
      font-size:.75rem;font-weight:500;padding:0 10px;height:32px;border-radius:8px;
      cursor:pointer;display:flex;align-items:center;white-space:nowrap;
    }
    .dchip.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
    .dchip:hover:not(.active){border-color:var(--border-2);color:var(--text)}

    .clear-filters{
      background:transparent;border:none;color:var(--text-faint);font-size:.75rem;
      cursor:pointer;padding:4px 6px;border-radius:6px;
    }
    .clear-filters:hover{color:var(--text-dim)}

    /* ── Status counts ── */
    #statusCounts{
      display:flex;align-items:center;gap:6px;flex-wrap:wrap;
      padding:6px 20px;border-bottom:1px solid var(--border);
      font-size:.75rem;background:var(--bg);
    }
    .sc-pill{
      display:inline-flex;align-items:center;gap:5px;
      padding:3px 10px;border-radius:999px;font-weight:500;cursor:pointer;
      border:1px solid transparent;background:transparent;
    }
    .sc-pill:hover{border-color:var(--border-2)}
    .sc-pill.active{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
    .sc-new    {color:var(--text-dim)}
    .sc-saved  {color:var(--accent)}
    .sc-applied{color:var(--green)}
    .sc-rejected{color:var(--red)}
    .sc-n{font-weight:700;font-size:.8rem}

    /* ── Notes ── */
    .notes-area{
      width:100%;min-height:72px;resize:vertical;
      background:var(--surface-2);border:1px solid var(--border);border-radius:8px;
      color:var(--text);font-size:.83rem;padding:9px 11px;line-height:1.5;
      font-family:inherit;outline:none;
    }
    .notes-area:focus{border-color:var(--accent)}
    .notes-saved{font-size:.72rem;color:var(--green);opacity:0;transition:opacity .3s}

    /* ── Run banner ── */
    #runBanner{
      display:none;align-items:center;gap:10px;
      padding:7px 20px;background:var(--surface);border-bottom:1px solid var(--border);
    }
    .run-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:pulse 1s infinite;flex-shrink:0}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}
    #runBannerText{flex:1;font-size:.8rem;color:var(--text-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .stop-btn{background:var(--red-soft);color:var(--red);border:none;padding:4px 12px;border-radius:7px;font-size:.76rem;font-weight:600;cursor:pointer}

    /* ── Table ── */
    .table-wrap{overflow-x:auto}

    table{
      width:100%;border-collapse:collapse;font-size:.855rem;
      min-width:760px;
    }

    thead th{
      background:var(--surface);
      padding:8px 14px;
      text-align:left;
      font-size:.72rem;font-weight:600;
      color:var(--text-dim);text-transform:uppercase;letter-spacing:.05em;
      border-bottom:1px solid var(--border);
      position:sticky;top:0;z-index:10;
      white-space:nowrap;cursor:pointer;user-select:none;
    }
    thead th:first-child{padding-left:20px}
    thead th:last-child{padding-right:20px;cursor:default}
    thead th:hover:not(:last-child){color:var(--text)}
    .sort-icon{display:inline-block;margin-left:4px;opacity:.3;font-style:normal;font-size:.7rem}
    thead th.asc  .sort-icon::after{content:"↑";opacity:1;color:var(--accent)}
    thead th.desc .sort-icon::after{content:"↓";opacity:1;color:var(--accent)}
    thead th:not(.asc):not(.desc) .sort-icon::after{content:"↕"}

    tbody tr{border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s}
    tbody tr:last-child{border-bottom:none}
    tbody tr:hover{background:var(--surface)}
    tbody td{padding:10px 14px;vertical-align:middle}
    tbody td:first-child{padding-left:20px}
    tbody td:last-child{padding-right:20px}

    /* title cell */
    .title-cell{white-space:normal;max-width:240px}
    .title-text{font-weight:600;color:var(--text);line-height:1.3;display:block}

    /* text cells */
    .cell-sm{max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.8rem;color:var(--text-dim)}
    .cell-md{max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.8rem;color:var(--text-dim)}

    /* chips */
    .chip{
      display:inline-flex;align-items:center;
      padding:2px 9px;border-radius:999px;font-size:.72rem;font-weight:600;
      white-space:nowrap;
    }
    .chip-remote {background:var(--green-soft);color:var(--green)}
    .chip-hybrid {background:var(--accent-soft);color:var(--accent)}
    .chip-onsite {background:var(--surface-3);color:var(--text-dim);border:1px solid var(--border)}

    /* status badge — clickable */
    .status-cell{position:relative}
    .sb{
      display:inline-flex;align-items:center;gap:5px;
      padding:3px 10px;border-radius:999px;font-size:.74rem;font-weight:600;
      cursor:pointer;user-select:none;white-space:nowrap;
    }
    .sb:hover{opacity:.8}
    .sb-new     {background:var(--surface-3);color:var(--text-dim);border:1px solid var(--border)}
    .sb-saved   {background:var(--accent-soft);color:var(--accent)}
    .sb-applied {background:var(--green-soft);color:var(--green)}
    .sb-rejected{background:var(--red-soft);color:var(--red)}

    /* inline status dropdown */
    .status-dropdown{
      position:absolute;top:calc(100% + 4px);left:0;z-index:50;
      background:var(--surface-2);border:1px solid var(--border-2);border-radius:10px;
      box-shadow:0 8px 30px rgba(0,0,0,.45);min-width:140px;overflow:hidden;
      animation:dropIn .12s ease;
    }
    @keyframes dropIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
    .status-dropdown .sd-item{
      display:flex;align-items:center;gap:8px;padding:8px 14px;cursor:pointer;
      font-size:.82rem;color:var(--text-dim);border-bottom:1px solid var(--border);
    }
    .status-dropdown .sd-item:last-child{border-bottom:none}
    .status-dropdown .sd-item:hover{background:var(--surface-3);color:var(--text)}
    .status-dropdown .sd-item.current{color:var(--text);font-weight:600}
    .sd-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
    .sd-dot-new     {background:var(--text-faint)}
    .sd-dot-saved   {background:var(--accent)}
    .sd-dot-applied {background:var(--green)}
    .sd-dot-rejected{background:var(--red)}

    /* date cell */
    .date-cell{color:var(--text-dim);font-size:.8rem;white-space:nowrap}
    .date-cell span{display:block}
    .date-cell .date-rel{font-weight:500;color:var(--text-dim)}
    .date-cell .date-abs{font-size:.72rem;color:var(--text-faint)}

    /* apply link */
    .apply-link{
      display:inline-flex;align-items:center;justify-content:center;
      width:28px;height:28px;border-radius:7px;
      color:var(--text-faint);font-size:.9rem;text-decoration:none;
      border:1px solid transparent;
    }
    .apply-link:hover{background:var(--surface-2);border-color:var(--border);color:var(--accent)}

    /* empty */
    .empty-state{
      text-align:center;padding:80px 20px;color:var(--text-dim);font-size:.9rem;line-height:2;
    }
    .empty-state .icon{font-size:2.5rem;margin-bottom:12px}

    /* ── Detail panel ── */
    #backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;opacity:0;pointer-events:none;transition:opacity .18s}
    #backdrop.open{opacity:1;pointer-events:auto}
    #panel{
      position:fixed;top:0;right:-420px;bottom:0;width:min(420px,95vw);
      background:var(--surface);border-left:1px solid var(--border);
      overflow-y:auto;z-index:41;transition:right .22s cubic-bezier(.4,0,.2,1);
      display:flex;flex-direction:column;
    }
    #panel.open{right:0}
    .panel-header{
      padding:18px 20px 14px;border-bottom:1px solid var(--border);
      position:sticky;top:0;background:var(--surface);z-index:2;
    }
    .panel-close{
      position:absolute;top:14px;right:16px;
      background:var(--surface-2);border:1px solid var(--border);color:var(--text-dim);
      width:28px;height:28px;border-radius:7px;font-size:.85rem;
      display:flex;align-items:center;justify-content:center;cursor:pointer;
    }
    .panel-close:hover{color:var(--text)}
    .panel-title{font-size:1.1rem;font-weight:700;line-height:1.35;padding-right:36px}
    .panel-sub{color:var(--text-dim);font-size:.85rem;margin-top:4px}
    .panel-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
    .panel-body{padding:18px 20px;flex:1}
    .detail-block{margin-bottom:16px}
    .detail-label{font-size:.68rem;font-weight:700;color:var(--text-dim);text-transform:uppercase;letter-spacing:.07em;margin-bottom:5px}
    .detail-value{font-size:.875rem;color:var(--text);line-height:1.6;white-space:pre-wrap}
    .panel-actions{
      display:grid;grid-template-columns:1fr 1fr;gap:8px;
      padding:14px 20px;border-top:1px solid var(--border);
      background:var(--surface);position:sticky;bottom:0;
    }
    .act{
      padding:9px;border-radius:9px;border:1px solid var(--border);
      background:var(--surface-2);color:var(--text-dim);font-size:.8rem;font-weight:600;
      cursor:pointer;text-align:center;
    }
    .act:hover{border-color:var(--border-2);color:var(--text)}
    .act-save   {background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
    .act-apply  {background:var(--green-soft);border-color:var(--green);color:var(--green)}
    .act-reject {background:var(--red-soft);border-color:var(--red);color:var(--red)}
    .open-btn{
      display:flex;align-items:center;justify-content:center;gap:6px;
      background:var(--accent);color:#fff;border:none;
      padding:10px 18px;border-radius:10px;font-size:.9rem;font-weight:600;
      cursor:pointer;text-decoration:none;
    }
    .open-btn:hover{opacity:.9}

    /* ── Toast ── */
    #toast{
      position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(14px);
      background:var(--surface-2);border:1px solid var(--border-2);color:var(--text);
      padding:8px 20px;border-radius:999px;font-size:.8rem;font-weight:500;
      z-index:100;opacity:0;pointer-events:none;transition:all .18s;white-space:nowrap;
      box-shadow:0 4px 20px rgba(0,0,0,.4);
    }
    #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

    /* ── Mobile card grid ── */
    .card-grid{display:none;flex-direction:column;gap:8px;padding:8px 12px 72px}
    .job-card{
      background:var(--surface);border:1px solid var(--border);border-radius:12px;
      padding:14px;cursor:pointer;transition:border-color .12s,background .12s;
    }
    .job-card:active{border-color:var(--border-2);background:var(--surface-2)}
    .card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:4px}
    .card-title{font-size:.92rem;font-weight:700;line-height:1.3;color:var(--text);flex:1}
    .card-date{font-size:.72rem;color:var(--text-faint);white-space:nowrap;flex-shrink:0;margin-top:2px}
    .card-sub{font-size:.78rem;color:var(--text-dim);margin-bottom:9px}
    .card-chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:9px}
    .card-bottom{display:flex;justify-content:space-between;align-items:center;gap:8px}
    .card-tech{font-size:.72rem;color:var(--text-faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}

    /* ── Mobile overrides ── */
    @media(max-width:640px){
      /* Toolbar */
      .toolbar-inner{padding:10px 14px;gap:8px}
      .run-btn .run-label{display:none}

      /* Filter bar stacks vertically */
      .filterbar{flex-direction:column;padding:8px 14px 10px;gap:7px}
      .search-wrap{max-width:100%;width:100%}
      .f-selects{display:flex;gap:6px;width:100%}
      select.f-sel{flex:1;min-width:0;font-size:.78rem;padding:0 4px}
      .f-divider{display:none}
      .date-chips{
        overflow-x:auto;-webkit-overflow-scrolling:touch;
        scrollbar-width:none;padding-bottom:2px;
      }
      .date-chips::-webkit-scrollbar{display:none}
      .clear-filters{align-self:flex-end}

      /* Status counts */
      #statusCounts{padding:6px 14px}
      #runBanner{padding:7px 14px}

      /* Hide table, show cards */
      .table-wrap{display:none}
      .card-grid{display:flex}

      /* Full-width panel on mobile */
      #panel{width:100vw;right:-100vw}
      #panel.open{right:0}
      .panel-actions{grid-template-columns:1fr 1fr}
    }
  </style>
</head>
<body>

<!-- ── Toolbar ── -->
<div class="toolbar">
  <div class="toolbar-inner">
    <div class="brand">
      <h1><span class="mark">✦</span> Job Board</h1>
      <span class="job-count" id="jobCount">0 jobs</span>
    </div>
    <div class="toolbar-right">
      <button class="run-btn" id="runBtn">▶ <span class="run-label">Run search</span></button>
      <a href="/settings" class="icon-btn" title="Settings">⚙</a>
    </div>
  </div>

  <div class="filterbar">
    <!-- Search -->
    <div class="search-wrap">
      <span class="mag">⌕</span>
      <input type="search" id="searchInput" placeholder="Search title, company…">
    </div>

    <div class="f-divider"></div>

    <div class="f-selects">
      <!-- Country -->
      <select class="f-sel" id="countrySelect">
        <option value="">🌍 All countries</option>
      </select>

      <!-- Work mode -->
      <select class="f-sel" id="modeSelect">
        <option value="">⊙ All modes</option>
        <option value="remote">🌐 Remote</option>
        <option value="hybrid">◑ Hybrid</option>
        <option value="onsite">🏢 On-site</option>
      </select>

      <!-- Status -->
      <select class="f-sel" id="statusSelect">
        <option value="">◉ All statuses</option>
        <option value="new">● New</option>
        <option value="saved">💾 Saved</option>
        <option value="applied">✓ Applied</option>
        <option value="rejected">✕ Rejected</option>
      </select>
    </div>

    <div class="f-divider"></div>

    <!-- Date quick filters -->
    <div class="date-chips">
      <button class="dchip active" data-days="">Any date</button>
      <button class="dchip" data-days="7">7 days</button>
      <button class="dchip" data-days="14">14 days</button>
      <button class="dchip" data-days="30">30 days</button>
    </div>

    <button class="clear-filters" id="clearFilters">✕ Clear</button>
  </div>
</div>

<!-- Status counts -->
<div id="statusCounts"></div>

<!-- Run banner -->
<div id="runBanner">
  <div class="run-dot"></div>
  <span id="runBannerText">Searching…</span>
  <button class="stop-btn" id="stopBtn">Stop</button>
</div>

<!-- ── Table ── -->
<div class="table-wrap">
  <table id="jobTable">
    <thead>
      <tr>
        <th data-col="status">Status <i class="sort-icon"></i></th>
        <th data-col="title" class="desc">Title <i class="sort-icon"></i></th>
        <th data-col="company">Company <i class="sort-icon"></i></th>
        <th data-col="country">Country <i class="sort-icon"></i></th>
        <th data-col="work_mode">Mode <i class="sort-icon"></i></th>
        <th data-col="salary">Salary <i class="sort-icon"></i></th>
        <th data-col="benefits">Benefits <i class="sort-icon"></i></th>
        <th data-col="keywords">Technologies <i class="sort-icon"></i></th>
        <th data-col="posted_at">Posted <i class="sort-icon"></i></th>
        <th></th>
      </tr>
    </thead>
    <tbody id="jobBody"></tbody>
  </table>
  <div id="emptyState" class="empty-state" style="display:none">
    <div class="icon">🔍</div>
    <p>No jobs match your filters.<br>Adjust filters or run a search.</p>
  </div>
</div>

<!-- ── Mobile card grid ── -->
<div id="cardGrid" class="card-grid"></div>

<!-- ── Detail side panel ── -->
<div id="backdrop"></div>
<div id="panel" role="dialog" aria-modal="true">
  <div class="panel-header">
    <button class="panel-close" id="panelClose">✕</button>
    <div class="panel-title" id="pTitle"></div>
    <div class="panel-sub" id="pSub"></div>
    <div class="panel-chips" id="pChips"></div>
  </div>
  <div class="panel-body" id="pBody"></div>
  <div style="padding:0 20px 16px">
    <div class="detail-label" style="margin-bottom:6px">Notes</div>
    <textarea class="notes-area" id="pNotes" placeholder="Add notes — interview stage, recruiter name, follow-up date…"></textarea>
    <span class="notes-saved" id="notesSaved">Saved</span>
  </div>
  <div class="panel-actions" id="pActions"></div>
</div>

<div id="toast"></div>

<script>
(() => {
  "use strict";

  // ── helpers ────────────────────────────────────────────────────────────────
  const $ = id => document.getElementById(id);
  function esc(s){ return String(s??'').replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])) }
  function fmtDate(iso){ if(!iso) return '—'; const d=new Date(iso); return isNaN(d)?'—':d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}) }
  function relDate(iso){
    if(!iso) return {rel:'—',abs:''};
    const d=new Date(iso),now=new Date(),diff=Math.floor((now-d)/86400000);
    let rel;
    if(diff===0) rel='Today';
    else if(diff===1) rel='Yesterday';
    else if(diff<7) rel=diff+'d ago';
    else if(diff<30) rel=Math.floor(diff/7)+'w ago';
    else rel=fmtDate(iso);
    return {rel, abs: diff>1 ? fmtDate(iso) : ''};
  }
  let _tt; function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(_tt); _tt=setTimeout(()=>t.classList.remove('show'),2200) }

  // ── state ──────────────────────────────────────────────────────────────────
  const filters = { country:'', workMode:'', status:'', q:'', days:'' };
  let allJobs = [];
  let sortCol = 'found_at';
  let sortDir = 'desc';
  let activeClientRun = 0;
  let runPollTimer = null;
  let openJobId = null;
  let openDropdownEl = null;

  // ── load jobs ──────────────────────────────────────────────────────────────
  async function loadJobs() {
    const sp = new URLSearchParams();
    if (filters.country)  sp.set('country',  filters.country);
    if (filters.workMode) sp.set('workMode', filters.workMode);
    if (filters.status)   sp.set('status',   filters.status);
    if (filters.q)        sp.set('q',        filters.q);
    if (filters.days) {
      const d = new Date(); d.setDate(d.getDate() - parseInt(filters.days));
      sp.set('after', d.toISOString().slice(0,10));
    }
    sp.set('limit','1000');

    try {
      const res = await fetch('/api/jobs?' + sp);
      const data = await res.json();

      // Country dropdown
      const sel = $('countrySelect');
      const prev = sel.value;
      sel.innerHTML = '<option value="">🌍 All countries</option>';
      for (const c of data.countries||[]) {
        sel.innerHTML += `<option value="${esc(c)}"${c===prev?' selected':''}>${esc(c)}</option>`;
      }
      if (prev && [...sel.options].some(o=>o.value===prev)) sel.value = prev;

      allJobs = data.jobs || [];
      renderTable();
      renderCounts(data.counts || {});
    } catch {
      $('jobCount').textContent = 'Error loading';
    }
  }

  function renderCounts(counts) {
    const total = (counts.new||0) + (counts.saved||0) + (counts.applied||0) + (counts.rejected||0);
    if (!total) { $('statusCounts').innerHTML = ''; return; }
    const active = filters.status;
    const pills = [
      { key:'',         label:'All',      n: total,             cls:'sc-new'      },
      { key:'new',      label:'New',      n: counts.new||0,     cls:'sc-new'      },
      { key:'saved',    label:'Saved',    n: counts.saved||0,   cls:'sc-saved'    },
      { key:'applied',  label:'Applied',  n: counts.applied||0, cls:'sc-applied'  },
      { key:'rejected', label:'Rejected', n: counts.rejected||0,cls:'sc-rejected' },
    ];
    $('statusCounts').innerHTML = pills.map(p =>
      `<button class="sc-pill ${p.cls}${active===p.key?' active':''}" data-sc="${p.key}">
        ${p.label} <span class="sc-n">${p.n}</span>
       </button>`
    ).join('');
  }

  // ── sort ───────────────────────────────────────────────────────────────────
  function sorted() {
    return [...allJobs].sort((a,b) => {
      let va=a[sortCol]??'', vb=b[sortCol]??'';
      if (sortCol==='found_at'||sortCol==='posted_at') {
        va = va ? new Date(va).getTime() : 0;
        vb = vb ? new Date(vb).getTime() : 0;
      } else { va=String(va).toLowerCase(); vb=String(vb).toLowerCase(); }
      const c = va<vb?-1:va>vb?1:0;
      return sortDir==='asc'?c:-c;
    });
  }

  // ── render ─────────────────────────────────────────────────────────────────
  const STATUS_META = {
    new:     { label:'● New',       cls:'sb-new',      dot:'sd-dot-new'     },
    saved:   { label:'💾 Saved',    cls:'sb-saved',    dot:'sd-dot-saved'   },
    applied: { label:'✓ Applied',   cls:'sb-applied',  dot:'sd-dot-applied' },
    rejected:{ label:'✕ Rejected', cls:'sb-rejected', dot:'sd-dot-rejected' },
  };
  const MODE_META = {
    remote: { label:'Remote',  cls:'chip-remote' },
    hybrid: { label:'Hybrid',  cls:'chip-hybrid' },
    onsite: { label:'On-site', cls:'chip-onsite' },
  };

  function compactBenefits(raw) {
    if (!raw || raw === 'Not specified in posting') return '—';
    const items = raw.split('\n').map(l => l.replace(/^-\s*/, '').trim()).filter(Boolean);
    return items.slice(0, 3).join(' · ') || '—';
  }

  function compactTech(raw) {
    if (!raw || raw === 'Not specified in posting') return '—';
    return raw.split(',').map(k => k.trim()).filter(Boolean).slice(0, 6).join(', ') || '—';
  }

  function compactSalary(raw) {
    if (!raw || raw === 'Not specified in posting') return '—';
    return raw.split(';')[0].trim().slice(0, 30) || '—';
  }

  function renderTable() {
    const rows = sorted();
    $('jobCount').textContent = rows.length + ' job' + (rows.length!==1?'s':'');

    document.querySelectorAll('thead th[data-col]').forEach(th => {
      th.classList.remove('asc','desc');
      if (th.dataset.col===sortCol) th.classList.add(sortDir);
    });

    if (!rows.length) {
      $('jobBody').innerHTML = '';
      $('emptyState').style.display = 'block';
      return;
    }
    $('emptyState').style.display = 'none';

    $('jobBody').innerHTML = rows.map(j => {
      const sm = STATUS_META[j.status] || STATUS_META.new;
      const mm = MODE_META[j.work_mode] || { label: j.work_mode||'—', cls:'chip-onsite' };
      const pd      = j.posted_at ? fmtDate(j.posted_at) : '—';
      const salary   = compactSalary(j.salary);
      const benefits = compactBenefits(j.benefits);
      const tech     = compactTech(j.keywords);
      return `<tr data-id="${esc(j.id)}">
        <td class="status-cell">
          <span class="sb ${sm.cls}" data-status-btn="${esc(j.id)}">${sm.label}</span>
        </td>
        <td class="title-cell">
          <span class="title-text">${esc(j.title)}</span>
        </td>
        <td class="cell-sm">${esc(j.company||'—')}</td>
        <td class="cell-sm">${esc(j.country||'—')}</td>
        <td><span class="chip ${mm.cls}">${mm.label}</span></td>
        <td class="cell-sm">${esc(salary)}</td>
        <td class="cell-md" title="${esc(j.benefits||'')}">${esc(benefits)}</td>
        <td class="cell-md" title="${esc(j.keywords||'')}">${esc(tech)}</td>
        <td class="date-cell"><span class="date-rel">${esc(pd)}</span></td>
        <td>
          <a class="apply-link" href="${esc(j.url)}" target="_blank" rel="noreferrer"
             title="Open listing" onclick="event.stopPropagation()">↗</a>
        </td>
      </tr>`;
    }).join('');
    renderCards();
  }

  function renderCards() {
    const cg = $('cardGrid');
    const rows = sorted();
    if (!rows.length) { cg.innerHTML = ''; return; }
    cg.innerHTML = rows.map(j => {
      const sm = STATUS_META[j.status] || STATUS_META.new;
      const mm = MODE_META[j.work_mode] || { label: j.work_mode||'—', cls:'chip-onsite' };
      const pd = j.posted_at ? fmtDate(j.posted_at) : '';
      const tech = compactTech(j.keywords);
      return `<div class="job-card" data-id="${esc(j.id)}">
        <div class="card-top">
          <div class="card-title">${esc(j.title)}</div>
          ${pd ? `<div class="card-date">${esc(pd)}</div>` : ''}
        </div>
        <div class="card-sub">${esc(j.company||'—')}${j.country?' · '+esc(j.country):''}</div>
        <div class="card-chips">
          <span class="sb ${sm.cls}" data-status-btn="${esc(j.id)}">${sm.label}</span>
          <span class="chip ${mm.cls}">${mm.label}</span>
        </div>
        <div class="card-bottom">
          <div class="card-tech">${esc(tech)}</div>
          <a class="apply-link" href="${esc(j.url)}" target="_blank" rel="noreferrer"
             title="Open listing" onclick="event.stopPropagation()">↗</a>
        </div>
      </div>`;
    }).join('');
  }

  // ── inline status dropdown ─────────────────────────────────────────────────
  function closeDropdown() {
    if (openDropdownEl) { openDropdownEl.remove(); openDropdownEl = null; }
  }

  function openStatusDropdown(jobId, anchorEl) {
    closeDropdown();
    const job = allJobs.find(j=>j.id===jobId);
    if (!job) return;

    const dp = document.createElement('div');
    dp.className = 'status-dropdown';
    dp.dataset.dropdownFor = jobId;

    const options = [
      { value:'new',      label:'New',      dot:'sd-dot-new'     },
      { value:'saved',    label:'Saved',    dot:'sd-dot-saved'   },
      { value:'applied',  label:'Applied',  dot:'sd-dot-applied' },
      { value:'rejected', label:'Rejected', dot:'sd-dot-rejected' },
    ];

    dp.innerHTML = options.map(o =>
      `<div class="sd-item${job.status===o.value?' current':''}" data-status-val="${esc(o.value)}">
        <span class="sd-dot ${o.dot}"></span>${o.label}
       </div>`
    ).join('');

    anchorEl.closest('.status-cell').appendChild(dp);
    openDropdownEl = dp;
  }

  // ── detail panel ───────────────────────────────────────────────────────────
  function openPanel(jobId) {
    const job = allJobs.find(j=>j.id===jobId);
    if (!job) return;
    openJobId = jobId;

    $('pTitle').textContent = job.title;
    $('pSub').textContent   = [job.company, job.location].filter(Boolean).join(' · ');

    const mm = MODE_META[job.work_mode] || { label: job.work_mode||'—', cls:'chip-onsite' };
    $('pChips').innerHTML =
      `<span class="chip ${mm.cls}">${mm.label}</span>` +
      (job.country ? `<span class="chip chip-onsite">${esc(job.country)}</span>` : '');

    let body = '';
    if (job.salary && job.salary!=='Not specified in posting')
      body += detail('Salary', job.salary);
    if (job.benefits && job.benefits!=='Not specified in posting')
      body += detail('Benefits', job.benefits);
    if (job.summary)
      body += detail('Summary', job.summary);
    if (job.keywords)
      body += detail('Keywords', job.keywords);
    const dateParts = [
      job.posted_at  ? 'Posted ' + fmtDate(job.posted_at)   : '',
      job.found_at   ? 'Found '  + fmtDate(job.found_at)    : '',
      job.applied_at ? '<span style="color:var(--green)">Applied ' + fmtDate(job.applied_at) + '</span>' : '',
    ].filter(Boolean).join('  ·  ');
    if (dateParts) body += `<div style="color:var(--text-dim);font-size:.78rem;margin-top:8px">${dateParts}</div>`;
    $('pBody').innerHTML = body;

    $('pNotes').value = job.notes || '';
    $('notesSaved').style.opacity = '0';

    renderPanelActions(job);

    $('backdrop').classList.add('open');
    $('panel').classList.add('open');
    $('panel').scrollTop = 0;
  }

  function detail(label, value) {
    return `<div class="detail-block">
      <div class="detail-label">${label}</div>
      <div class="detail-value">${esc(value)}</div>
    </div>`;
  }

  function renderPanelActions(job) {
    const id = job.id;
    const s  = job.status;
    let html = '';
    if (s!=='saved')    html += `<button class="act act-save"   data-action="status" data-id="${esc(id)}" data-status="saved">💾 Save</button>`;
    if (s!=='applied')  html += `<button class="act act-apply"  data-action="status" data-id="${esc(id)}" data-status="applied">✓ Applied</button>`;
    if (s!=='rejected') html += `<button class="act act-reject" data-action="status" data-id="${esc(id)}" data-status="rejected">✕ Skip</button>`;
    if (s!=='new')      html += `<button class="act"            data-action="status" data-id="${esc(id)}" data-status="new">↩ Reset</button>`;
    html += `<a class="open-btn" href="${esc(job.url)}" target="_blank" rel="noreferrer" style="grid-column:1/-1">Open listing →</a>`;
    $('pActions').innerHTML = html;
  }

  function closePanel() {
    $('backdrop').classList.remove('open');
    $('panel').classList.remove('open');
    openJobId = null;
  }

  // ── notes save ─────────────────────────────────────────────────────────────
  let notesSaveTimer;
  async function saveNotes(id, text) {
    try {
      await fetch(`/api/jobs/${id}/notes`, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ notes: text })
      });
      const job = allJobs.find(j=>j.id===id);
      if (job) job.notes = text;
      const el = $('notesSaved');
      el.style.opacity = '1';
      clearTimeout(notesSaveTimer);
      notesSaveTimer = setTimeout(() => el.style.opacity = '0', 1800);
    } catch {}
  }

  $('pNotes').addEventListener('input', () => {
    if (!openJobId) return;
    clearTimeout(notesSaveTimer);
    notesSaveTimer = setTimeout(() => saveNotes(openJobId, $('pNotes').value), 800);
  });

  // ── status update ──────────────────────────────────────────────────────────
  async function setStatus(id, status) {
    try {
      await fetch(`/api/jobs/${id}/status`, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ status })
      });
      const job = allJobs.find(j=>j.id===id);
      if (job) {
        job.status = status;
        job.applied_at = status === 'applied' ? new Date().toISOString() : '';
        if (openJobId===id) { renderPanelActions(job); openPanel(id); }
        if (!filters.status || filters.status===status) renderTable();
        else { allJobs = allJobs.filter(j=>j.id!==id); renderTable(); closePanel(); }
      }
      const labels = { saved:'Saved 💾', applied:'Applied ✓', rejected:'Skipped', new:'Reset' };
      toast(labels[status]||status);
    } catch { toast('Could not update status'); }
  }

  // ── events ─────────────────────────────────────────────────────────────────
  // Column sort
  document.querySelectorAll('thead th[data-col]').forEach(th => {
    th.addEventListener('click', () => {
      const col = th.dataset.col;
      if (sortCol===col) sortDir = sortDir==='asc'?'desc':'asc';
      else { sortCol=col; sortDir=(col==='found_at'||col==='posted_at')?'desc':'asc'; }
      renderTable();
    });
  });

  // Global click handler
  document.addEventListener('click', e => {
    // Status badge → inline dropdown
    const badge = e.target.closest('[data-status-btn]');
    if (badge) {
      e.stopPropagation();
      const id = badge.dataset.statusBtn;
      if (openDropdownEl?.dataset.dropdownFor===id) { closeDropdown(); }
      else { openStatusDropdown(id, badge); }
      return;
    }

    // Dropdown item
    const sdItem = e.target.closest('.sd-item[data-status-val]');
    if (sdItem) {
      e.stopPropagation();
      const dp = sdItem.closest('[data-dropdown-for]');
      const id = dp?.dataset.dropdownFor;
      const status = sdItem.dataset.statusVal;
      closeDropdown();
      if (id && status) setStatus(id, status);
      return;
    }

    // Click outside dropdown → close it
    if (openDropdownEl && !openDropdownEl.contains(e.target)) { closeDropdown(); }

    // Panel action buttons
    const actBtn = e.target.closest('[data-action="status"]');
    if (actBtn) { setStatus(actBtn.dataset.id, actBtn.dataset.status); return; }

    // Table row or mobile card → open panel
    const row = e.target.closest('tbody tr, .job-card');
    if (row && !e.target.closest('a')) { openPanel(row.dataset.id); return; }

    // Panel / backdrop close
    if (e.target===$('backdrop') || e.target===$('panelClose')) { closePanel(); return; }
  });

  // Filters
  $('countrySelect').addEventListener('change', e => { filters.country=e.target.value; loadJobs(); });
  $('modeSelect').addEventListener('change',   e => { filters.workMode=e.target.value; loadJobs(); });
  $('statusSelect').addEventListener('change', e => { filters.status=e.target.value;  loadJobs(); });

  document.querySelectorAll('.dchip').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.dchip').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      filters.days = btn.dataset.days;
      loadJobs();
    });
  });

  let searchTimer;
  $('searchInput').addEventListener('input', e => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => { filters.q=e.target.value.trim(); loadJobs(); }, 280);
  });

  $('clearFilters').addEventListener('click', () => {
    filters.country=''; filters.workMode=''; filters.status=''; filters.q=''; filters.days='';
    $('countrySelect').value=''; $('modeSelect').value=''; $('statusSelect').value='';
    $('searchInput').value='';
    document.querySelectorAll('.dchip').forEach((b,i)=>b.classList.toggle('active',i===0));
    loadJobs();
  });

  document.addEventListener('click', e => {
    const pill = e.target.closest('[data-sc]');
    if (pill && $('statusCounts').contains(pill)) {
      const val = pill.dataset.sc;
      filters.status = val;
      $('statusSelect').value = val;
      loadJobs();
    }
  }, true);

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { closeDropdown(); closePanel(); return; }
    if (!openJobId || e.target.matches('textarea,input,select')) return;
    if (e.key === 's' || e.key === 'S') { e.preventDefault(); setStatus(openJobId, 'saved'); }
    if (e.key === 'a' || e.key === 'A') { e.preventDefault(); setStatus(openJobId, 'applied'); }
    if (e.key === 'r' || e.key === 'R') { e.preventDefault(); setStatus(openJobId, 'rejected'); }
  });

  // ── run now ────────────────────────────────────────────────────────────────
  function stopPoll() { if(runPollTimer){ clearInterval(runPollTimer); runPollTimer=null; } }

  let pollTick = 0;
  async function pollRun(cr) {
    if (cr!==activeClientRun) return;
    pollTick++;
    try {
      const res = await fetch('/api/run-status');
      const data = await res.json();
      const run  = data.run||{};
      if (run.active) {
        const logs = run.logs||[];
        const last = (logs[logs.length-1]||'Running…').replace(/^\[[^\]]+\]\s*/,'');
        $('runBannerText').textContent = last;
        if (pollTick % 3 === 0) loadJobs();
      }
      if (!run.active) {
        stopPoll();
        $('runBanner').style.display='none';
        $('runBtn').innerHTML='▶ <span class="run-label">Run search</span>';
        $('runBtn').disabled=false;
        if (run.error) toast('Error: '+run.error);
        else toast('Search complete — reloading…');
        loadJobs();
      }
    } catch {}
  }

  $('runBtn').addEventListener('click', async () => {
    const cr=++activeClientRun;
    $('runBtn').innerHTML='…'; $('runBtn').disabled=true;
    $('runBanner').style.display='flex'; $('runBannerText').textContent='Starting…';
    try {
      await fetch('/api/prepare-run',{method:'POST'});
      await fetch('/api/run-now',{method:'POST'});
      stopPoll();
      runPollTimer=setInterval(()=>pollRun(cr),1500);
    } catch {
      $('runBanner').style.display='none';
      $('runBtn').innerHTML='▶ <span class="run-label">Run search</span>'; $('runBtn').disabled=false;
      toast('Could not start run');
    }
  });

  $('stopBtn').addEventListener('click', async () => {
    await fetch('/api/stop-run',{method:'POST'});
    toast('Stopping…');
  });

  // ── init ───────────────────────────────────────────────────────────────────
  loadJobs();
  (async()=>{
    try {
      const res=await fetch('/api/run-status'); const data=await res.json();
      if(data.run?.active){
        $('runBanner').style.display='flex';
        $('runBtn').innerHTML='…'; $('runBtn').disabled=true;
        runPollTimer=setInterval(()=>pollRun(activeClientRun),1500);
      }
    } catch {}
  })();
})();
</script>
</body>
</html>
